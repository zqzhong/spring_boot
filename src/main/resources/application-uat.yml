server:
  port: 8083

spring:
  profiles: uat
  logging:
    path:D:\java\logs\message.log
  datasource:
    username: root
    password: root
    url: jdbc:mysql://localhost:3306/spring_boot?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0  # 默认数据库索引，0-15
      timeout: 5000ms  # 连接超时时间
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://127.0.0.1:6379"

mybatis:
  typeAliasesPackage: org.maven.Spring.console.entity
  mapperLocations: classpath*:mapper/*.xml
